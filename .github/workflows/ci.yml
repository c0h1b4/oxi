name: CI

on:
  push:
    branches: [develop, main]
    tags: ['v*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend (Rust, ${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: oxi
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: oxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxi -d oxi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          assert re.fullmatch(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?", tag), f"Invalid release tag: {tag}"
          version = tag.removeprefix("v")
          manifest = tomllib.loads(Path("Cargo.toml").read_text())
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          frontend = json.loads(Path("../frontend/package.json").read_text())
          package = next(p for p in lock["package"] if p["name"] == manifest["package"]["name"])
          for name, actual in {
              "Cargo.toml": manifest["package"]["version"],
              "Cargo.lock": package["version"],
              "package.json": frontend["version"],
          }.items():
              assert actual == version, f"{name}: {actual} does not match {tag}"
          print(f"Release versions match {tag}")
          PY

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Test (SQLite)
        if: matrix.database == 'sqlite'
        run: cargo test

      - name: Test (PostgreSQL)
        if: matrix.database == 'postgres'
        env:
          OXI_TEST_DATABASE_URL: postgres://oxi:test-only@localhost:5432/oxi_test
        run: cargo test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (unit)
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build (static export)
        run: bun run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
