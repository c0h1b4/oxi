name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

# Serialize publication so a slower old run cannot overwrite newer image aliases.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify package versions
        run: python3 .github/scripts/version.py current
      - name: Require a bump for main PRs (unless labeled no-release)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python3 .github/scripts/version.py check --base "$BASE_SHA"
      - name: Prevent version rollback on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/version.py check --base "$BASE_SHA" --allow-same
      - name: Plan release
        id: plan
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          BASE_SHA: ${{ github.event.before || format('{0}^', github.sha) }}
        run: python3 .github/scripts/version.py plan --base "$BASE_SHA"

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/

      - name: Lint (clippy)
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun run lint

      - name: Test (unit)
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build (static export)
        run: bun run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [version, backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=sha
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
            type=raw,value=${{ needs.version.outputs.tag }},enable=${{ needs.version.outputs.publish == 'true' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish == 'true' && needs.version.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.publish == 'true' && needs.version.outputs.prerelease == 'false' && !startsWith(needs.version.outputs.version, '0.') }}
            type=raw,value=latest,enable=${{ needs.version.outputs.publish == 'true' && needs.version.outputs.prerelease == 'false' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub release
    needs: [version, docker]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Tag and publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash .github/scripts/release.sh
