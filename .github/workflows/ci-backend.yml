name: Backend

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  check:
    name: Rust (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, test, test-postgres]
    services:
      postgres:
        image: ${{ matrix.check == 'test-postgres' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: oxi
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: oxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oxi -d oxi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: ci-${{ matrix.check }}
          cache-on-failure: true
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --locked -- -D warnings
      - name: Tests (SQLite)
        if: matrix.check == 'test'
        run: cargo test --locked
      - name: Tests (PostgreSQL)
        if: matrix.check == 'test-postgres'
        env:
          OXI_TEST_DATABASE_URL: postgres://oxi:test-only@localhost:5432/oxi_test
        run: cargo test --locked
