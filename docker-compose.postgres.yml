# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  app:
    environment:
      DATABASE_URL: postgres://oxi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/oxi
      DATABASE_MAX_CONNECTIONS: "10"
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: oxi
      POSTGRES_USER: oxi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - oxi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oxi -d oxi"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  oxi-postgres:
